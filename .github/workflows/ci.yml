name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-26 }
          - { arch: x86_64, runner: macos-26-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select the Xcode that releases are built with
        run: |
          xcode="/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer"
          test -d "$xcode"
          echo "DEVELOPER_DIR=$xcode" >> "$GITHUB_ENV"
      - run: xcodebuild -version && xcrun swift --version
      - name: Build the universal binary
        run: xcrun swift build -c release --arch arm64 --arch x86_64 -Xswiftc -warnings-as-errors
      - run: xcrun swift test
      - name: Smoke test (runs the ${{ matrix.arch }} half)
        run: |
          bin=.build/apple/Products/Release/flatlink
          lipo "$bin" -verify_arch arm64 x86_64
          test "$(uname -m)" = "${{ matrix.arch }}"
          mkdir -p "$RUNNER_TEMP/s/day" && touch "$RUNNER_TEMP/s/day/A.DNG" "$RUNNER_TEMP/s/day/A.JPG" "$RUNNER_TEMP/s/B.jpg"
          "$bin" --skip-paired-jpegs "$RUNNER_TEMP/s" "$RUNNER_TEMP/f"
          test "$(find "$RUNNER_TEMP/f" -type l | wc -l | tr -d ' ')" = 2

  app:
    name: Build the app
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select the Xcode that releases are built with
        run: |
          xcode="/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer"
          test -d "$xcode"
          echo "DEVELOPER_DIR=$xcode" >> "$GITHUB_ENV"
      - name: Install XcodeGen
        run: brew install xcodegen
      # The .xcodeproj is generated and not committed; there is nothing to build until this runs.
      - name: Generate the project
        working-directory: App
        run: xcodegen generate
      # Release, as it ships, but unsigned: CI holds no Developer ID.
      - name: Build (Release, arm64 + x86_64)
        working-directory: App
        run: |
          set -o pipefail
          xcodebuild -project Flatlink.xcodeproj -scheme Flatlink -configuration Release \
                     -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/app" \
                     ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
                     CODE_SIGNING_ALLOWED=NO build
      - name: Check the bundle, and that it starts
        run: |
          app="$RUNNER_TEMP/app/Build/Products/Release/Flatlink.app"
          archs=$(lipo -archs "$app/Contents/MacOS/Flatlink")
          [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "::error::not universal: $archs"; exit 1; }
          test -f "$app/Contents/Resources/AppIcon.icns"
          "$app/Contents/MacOS/Flatlink" &
          pid=$!
          sleep 5
          kill -0 "$pid" || { echo "::error::the app quit within 5 seconds of starting"; exit 1; }
          kill "$pid"

  lint:
    name: Lint the release script
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: shellcheck scripts/release.sh
