    <path transform="translate(939.5,26)" d="M0,4 a3,3 0 0 1 3,-3 h8 l3.5,4 h12.5 a3,3 0 0 1 3,3 v12 a3,3 0 0 1 -3,3 h-24 a3,3 0 0 1 -3,-3 z" fill="#FFFFFF" fill-opacity="0.9"/>
    <circle cx="954.5" cy="72" r="4.5" fill="#FFFFFF" fill-opacity="0.9"/>
