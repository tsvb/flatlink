<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="flatlink: every photo in a folder tree, in one DxO PhotoLab grid">
  <title>flatlink</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2438"/>
      <stop offset="0.5" stop-color="#0D3654"/>
      <stop offset="1" stop-color="#155178"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Card panel: self-contained, so it reads on light and dark backgrounds alike -->
  <rect x="6" y="6" width="1188" height="328" rx="26" fill="url(#bg)"/>
  <rect x="6" y="6" width="1188" height="328" rx="26" fill="url(#glow)"/>

  <!-- Wordmark, set in the face it is typed in -->
  <text font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" x="70" y="142" font-size="88" font-weight="700" letter-spacing="-2" fill="#FFFFFF">flatlink</text>
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" x="74" y="192" font-size="26" font-weight="500" fill="#FFFFFF" fill-opacity="0.88">Every photo in a folder tree,</text>
  <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" x="74" y="226" font-size="26" font-weight="500" fill="#FFFFFF" fill-opacity="0.88">in one DxO PhotoLab grid.</text>
  <text font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace" x="74" y="278" font-size="20" fill="#BFDDF2" fill-opacity="0.8"><tspan fill="#E89E29" fill-opacity="1">$</tspan> flatlink Photos PhotoLab-All</text>

